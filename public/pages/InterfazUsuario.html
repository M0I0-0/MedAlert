<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Medilab - Perfil</title>
  <link rel="stylesheet" href="../css/InterfazUsuario.css">
</head>
<body>

<header class="navbar">
  <h1>Medilab</h1>
</header>

<div class="container">
  <div class="form-card">

    <div class="icono">👤</div>
    <h2>Perfil del Paciente</h2>

    <div class="form-group">
      <label>Nombre</label>
      <input type="text" placeholder="Ingrese el nombre del paciente">
    </div>

    <div class="form-group">
      <label>Edad</label>
      <input type="number" placeholder="Ingrese la edad">
    </div>

    <div class="row">
      <div class="form-group">
        <label>Peso (kg)</label>
        <input type="text" id="peso" placeholder="Ingrese el peso">
        <span class="error">Solo números</span>
      </div>

      <div class="form-group">
        <label>Altura (cm)</label>
        <input type="text" id="altura" placeholder="Ingrese la altura">
        <span class="error">Solo números</span>
      </div>
    </div>

    <div class="form-group">
      <label>Tipo de sangre</label>
      <select>
        <option>Seleccione el tipo de sangre</option>
        <option>O+</option>
        <option>O-</option>
        <option>A+</option>
        <option>A-</option>
      </select>
    </div>

    <div class="form-group">
      <label>Alergias</label>
      <div class="checkbox-group">
        <label><input type="checkbox"> Polen</label>
        <label><input type="checkbox"> Polvo</label>
        <label><input type="checkbox"> Lácteos</label>
        <label><input type="checkbox"> Ninguna</label>
      </div>
    </div>

    <button class="btn">Guardar</button>

  </div>
</div>

</body>
</html>
